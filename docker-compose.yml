services:
  bot:
    build: .
    container_name: whatsmusic-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./plugins:/app/plugins
    environment:
      - TZ=Asia/Tehran
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.getenv('BOT_TOKEN')"]
      interval: 60s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    container_name: whatsmusic-dashboard
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "dashboard.py"]
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Tehran
